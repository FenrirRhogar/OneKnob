name: Build OneKnobToRuleThemAll

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Plugin
      run: cmake --build build --config Release --parallel 4

    - name: Zip Artifacts
      run: |
        Compress-Archive -Path "build/OneKnobToRuleThemAll_artefacts/Release/VST3/OneKnobToRuleThemAll.vst3" -DestinationPath "OneKnobToRuleThemAll_Windows_VST3.zip"
        Compress-Archive -Path "build/OneKnobToRuleThemAll_artefacts/Release/Standalone/OneKnobToRuleThemAll.exe" -DestinationPath "OneKnobToRuleThemAll_Windows_Standalone.zip"

    - name: Upload Windows VST3
      uses: actions/upload-artifact@v4
      with:
        name: OneKnobToRuleThemAll-Windows-VST3
        path: OneKnobToRuleThemAll_Windows_VST3.zip

    - name: Upload Windows Standalone
      uses: actions/upload-artifact@v4
      with:
        name: OneKnobToRuleThemAll-Windows-Standalone
        path: OneKnobToRuleThemAll_Windows_Standalone.zip

  build-macos:
    name: macOS Build
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -G Xcode -DCMAKE_BUILD_TYPE=Release

    - name: Build Plugin
      run: cmake --build build --config Release --parallel 4

    - name: Zip Artifacts
      run: |
        cd build/OneKnobToRuleThemAll_artefacts/Release
        zip -r ../../../OneKnobToRuleThemAll_Mac_VST3.zip VST3/OneKnobToRuleThemAll.vst3
        zip -r ../../../OneKnobToRuleThemAll_Mac_AU.zip AU/OneKnobToRuleThemAll.component

    - name: Upload Mac VST3
      uses: actions/upload-artifact@v4
      with:
        name: OneKnobToRuleThemAll-Mac-VST3
        path: OneKnobToRuleThemAll_Mac_VST3.zip

    - name: Upload Mac AU
      uses: actions/upload-artifact@v4
      with:
        name: OneKnobToRuleThemAll-Mac-AU
        path: OneKnobToRuleThemAll_Mac_AU.zip
